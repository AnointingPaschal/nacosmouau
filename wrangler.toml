name = "nacos-mouau-platform"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-19"

# D1 binding is configured here because this Pages project deploys from Wrangler config.
# The database UUID identifies the database; do not commit API tokens or secrets.

[[d1_databases]]
binding = "DB"
database_name = "nacos-mouau"
database_id = "51c7fdd7-e6d0-4269-8e0b-d0cf2fe68f38"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nacos-mouau-media"
